aid: kixeye
name: Kixeye
description: 'KIXEYE Inc. is a video game developer and publisher founded in 2009 and headquartered in
  Victoria, British Columbia, with staff across Canada and the United States. KIXEYE creates, develops,
  and publishes massively multiplayer online real-time strategy (MMORTS) games for browsers, tablets,
  and smartphones, including Battle Pirates, War Commander, War Commander: Rogue Assault, and Rise of
  Firstborn. An early innovator in the free-to-play genre, KIXEYE operates long-lived live-service game
  worlds with monthly events, alliances, and competitive leaderboards for millions of players worldwide.
  KIXEYE is part of the Stillfront Group. KIXEYE publishes no public developer program or partner API;
  its api.kixeye.com host is a private game-services backend that exposes an OpenID Connect discovery
  document and JWKS for token verification. The company does maintain a public GitHub organization of
  open-source infrastructure libraries (chassis, kixmpp, janus, scout) used to build its own cloud
  services.'
